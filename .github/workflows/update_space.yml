name: Push to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone the repository using raw bash (Zero Node.js dependency)
      - name: Fetch Codebase via Native Git
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com/ayeshaswy/ChatbotProject.git .

      # Step 2: Push directly to Hugging Face using clean Git mirroring
      - name: Mirror to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run:
          git remote add space https://.:$HF_TOKEN@huggingface.co/spaces/yeshaswy/ChatWithMeChatbot
          git push --force space main