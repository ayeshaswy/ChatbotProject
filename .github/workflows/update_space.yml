name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Use the stable Node 24 native checkout version
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Drop setup-python entirely. Use the official Node 24 native UV action
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11' # Matches your project runtime

      # 3. Synchronise your project dependencies effortlessly
      - name: Install Dependencies
        run: uv sync

      # 4. Your original Gradio / Spaces push logic continues here...
      - name: Push to Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: gradio deploy --non-interactive