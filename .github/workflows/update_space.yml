name: Push to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out repository code using the Node 24 native action
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      # Step 2: Push code directly to Hugging Face using clean Git commands
      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run:
          git remote add space https://.:$HF_TOKEN@huggingface.co/spaces/yeshaswy/ChatWithMeChatbot
          git push --force space main